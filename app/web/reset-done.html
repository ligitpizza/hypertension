<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password changed · Harvey</title>
  <!-- D-65: Firebase's reset page continues here after a new password is saved. -->
  <style>
    :root { --primary: #2D6A8E; --bg: #F5F8FB; --card: #FFFFFF; --text: #1B1F24; --muted: #5B6670; }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #8CC8EE; --bg: #111418; --card: #1C2127; --text: #E6EAEE; --muted: #A4AEB8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 24px;
            text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; display: grid; place-items: center;
            background: color-mix(in srgb, var(--primary) 18%, transparent); font-size: 32px; color: var(--primary); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    a.btn { display: block; padding: 14px; border-radius: 999px; text-decoration: none; font-weight: 600; margin-top: 10px; }
    .primary { background: var(--primary); color: #fff; }
    .secondary { border: 1.5px solid var(--primary); color: var(--primary); }
    @media (prefers-color-scheme: dark) { .primary { color: #0B1A24; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">&#10084;</div>
    <h1>Password changed</h1>
    <p>Your Harvey password has been updated. Return to the app and sign in with your new password.</p>
    <a id="open-app" class="btn primary"
       href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=fyp.hypertension.patient;end">
      Open the Harvey app</a>
    <a class="btn secondary" href="/">Go to the staff portal</a>
    <p style="margin-top:20px;font-size:14px">If the app doesn't open, open Harvey from your home screen.</p>
  </main>
  <script>
    // The "open app" link only works on Android phones; elsewhere hide it.
    if (!/Android/i.test(navigator.userAgent)) document.getElementById('open-app').style.display = 'none';
  </script>
</body>
</html>
